<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crane Transparent Controls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* =========================================================================
       PURE TRANSPARENT CIRCULAR GUIDE (ZERO TRANSLUCENT FOG)
       ========================================================================= */
    /* =========================================================================
       CRYSTAL CLEAR HUD DIAL (ZERO BLACKISH TINT)
       ========================================================================= */
    .circular-controller {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: transparent !important;
      border: 1.5px dashed rgba(245, 158, 11, 0.7); /* Construction Amber ring */
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.35));
    }

    /* Subtle Rotating Outer Dash Accent */
    .orbit-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dotted rgba(245, 158, 11, 0.45);
      pointer-events: none;
      animation: slowSpin 40s linear infinite;
    }
    @keyframes slowSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* =========================================================================
       CRYSTAL CLEAR GLASS BUTTONS (ZERO BLACKISH FILL, HIGH TRANSPARENCY)
       ========================================================================= */
    .radial-btn {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      background: rgba(255, 255, 255, 0.3) !important; /* Highly transparent crystal glass */
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .radial-btn:hover {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.75) !important;
    }

    .radial-btn:active {
      transform: scale(0.92);
    }

    .radial-btn svg {
      transition: all 0.16s ease;
    }

    /* -------------------------------------------------------------------------
       1. CENTER: STOP ROTATION (INDUSTRIAL SAFETY RED)
       ------------------------------------------------------------------------- */
    .btn-center-stop {
      width: 54px;
      height: 54px;
      background: rgba(254, 226, 226, 0.45) !important;
      border: 2px solid #ef4444;
      color: #ef4444;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(239, 68, 68, 0.25);
    }
    .btn-center-stop svg {
      width: 22px;
      height: 22px;
      fill: #ef4444 !important;
    }
    .btn-center-stop:hover {
      background: rgba(254, 202, 202, 0.85) !important;
      border-color: #dc2626;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }
    .btn-center-stop.active-state {
      background: #ef4444 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 28px #ef4444 !important;
    }
    .btn-center-stop.active-state svg {
      fill: #ffffff !important;
    }

    /* -------------------------------------------------------------------------
       2. LEFT (9 O'CLOCK): ROTATE ANTI-CLOCKWISE / CCW (AMBER GOLD)
       ------------------------------------------------------------------------- */
    .btn-left-ccw {
      left: 8px;
      width: 45px;
      height: 45px;
      background: rgba(254, 243, 199, 0.45) !important;
      border: 2px solid #f59e0b;
      color: #d97706;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
    }
    .btn-left-ccw svg {
      width: 24px;
      height: 24px;
      stroke: #d97706 !important;
    }
    .btn-left-ccw:hover {
      background: rgba(253, 230, 138, 0.85) !important;
      border-color: #d97706;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }
    .btn-left-ccw.active-state {
      background: #f59e0b !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 28px #f59e0b !important;
      animation: spinCCW 2.4s linear infinite;
    }
    .btn-left-ccw.active-state svg {
      stroke: #ffffff !important;
    }
    @keyframes spinCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* -------------------------------------------------------------------------
       3. RIGHT (3 O'CLOCK): ROTATE CLOCKWISE / CW (AMBER GOLD)
       ------------------------------------------------------------------------- */
    .btn-right-cw {
      right: 8px;
      width: 45px;
      height: 45px;
      background: rgba(254, 243, 199, 0.45) !important;
      border: 2px solid #f59e0b;
      color: #d97706;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
    }
    .btn-right-cw svg {
      width: 24px;
      height: 24px;
      stroke: #d97706 !important;
    }
    .btn-right-cw:hover {
      background: rgba(253, 230, 138, 0.85) !important;
      border-color: #d97706;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }
    .btn-right-cw.active-state {
      background: #f59e0b !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 28px #f59e0b !important;
      animation: spinCW 2.4s linear infinite;
    }
    .btn-right-cw.active-state svg {
      stroke: #ffffff !important;
    }
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* -------------------------------------------------------------------------
       4. TOP (12 O'CLOCK): MAGNET ON (EMERALD GREEN)
       ------------------------------------------------------------------------- */
    .btn-top-mag-on {
      top: 8px;
      width: 45px;
      height: 45px;
      background: rgba(209, 250, 229, 0.45) !important;
      border: 2px solid #10b981;
      color: #059669;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-top-mag-on svg {
      width: 24px;
      height: 24px;
    }
    .btn-top-mag-on:hover {
      background: rgba(167, 243, 208, 0.85) !important;
      border-color: #059669;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-top-mag-on.active-state {
      background: #10b981 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 28px #10b981 !important;
    }
    .btn-top-mag-on.active-state svg path {
      fill: #ffffff !important;
    }

    /* -------------------------------------------------------------------------
       5. BOTTOM (6 O'CLOCK): MAGNET OFF (ORANGE / CORAL)
       ------------------------------------------------------------------------- */
    .btn-bottom-mag-off {
      bottom: 8px;
      width: 45px;
      height: 45px;
      background: rgba(255, 237, 213, 0.45) !important;
      border: 2px solid #f97316;
      color: #ea580c;
      box-shadow: 0 2px 10px rgba(249, 115, 22, 0.25);
    }
    .btn-bottom-mag-off svg {
      width: 24px;
      height: 24px;
    }
    .btn-bottom-mag-off:hover {
      background: rgba(254, 215, 170, 0.85) !important;
      border-color: #ea580c;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }
    .btn-bottom-mag-off.active-state {
      background: #f97316 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 28px #f97316 !important;
    }
    .btn-bottom-mag-off.active-state svg path {
      fill: #ffffff !important;
    }
    .btn-bottom-mag-off.active-state svg line {
      stroke: #ffffff !important;
    }
  </style>
</head>
<body>

  <!-- Pure Transparent Circular Controller -->
  <div class="circular-controller" id="controller">
    <div class="orbit-ring"></div>

    <!-- 12 O'CLOCK: MAGNET ON (PROPER MATERIAL DESIGN HORSESHOE MAGNET) -->
    <button class="radial-btn btn-top-mag-on" id="btnMagOn" aria-label="Magnet On">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path d="M4 3v8c0 4.418 3.582 8 8 8s8-3.582 8-8V3h-4v8c0 2.209-1.791 4-4 4s-4-1.791-4-4V3H4z" fill="#059669"/>
        <rect x="4" y="3" width="4" height="3.5" rx="0.5" fill="#ef4444"/>
        <rect x="16" y="3" width="4" height="3.5" rx="0.5" fill="#3b82f6"/>
      </svg>
    </button>

    <!-- 9 O'CLOCK: ROTATE LEFT - ANTICLOCKWISE (CCW) -->
    <button class="radial-btn btn-left-ccw" id="btnCCW" aria-label="Anticlockwise">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#d97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4.5L4 8l5 3.5"/>
        <path d="M4 8h8a7 7 0 1 1-7 7"/>
      </svg>
    </button>

    <!-- CENTER: PUNCHABLE STOP (CRIMSON RED) -->
    <button class="radial-btn btn-center-stop" id="btnStop" aria-label="Stop">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#ef4444">
        <rect x="6" y="6" width="12" height="12" rx="2.5" />
      </svg>
    </button>

    <!-- 3 O'CLOCK: ROTATE RIGHT - CLOCKWISE (CW) -->
    <button class="radial-btn btn-right-cw" id="btnCW" aria-label="Clockwise">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#d97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 4.5L20 8l-5 3.5"/>
        <path d="M20 8h-8a7 7 0 1 0 7 7"/>
      </svg>
    </button>

    <!-- 6 O'CLOCK: MAGNET OFF (PROPER HORSESHOE MAGNET WITH STRIKE) -->
    <button class="radial-btn btn-bottom-mag-off" id="btnMagOff" aria-label="Magnet Off">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path d="M4 3v8c0 4.418 3.582 8 8 8s8-3.582 8-8V3h-4v8c0 2.209-1.791 4-4 4s-4-1.791-4-4V3H4z" fill="#ea580c" opacity="0.6"/>
        <rect x="4" y="3" width="4" height="3.5" rx="0.5" fill="#94a3b8"/>
        <rect x="16" y="3" width="4" height="3.5" rx="0.5" fill="#94a3b8"/>
        <line x1="3" y1="3" x2="21" y2="21" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>

  </div>

  <script>
    // =========================================================================
    // CONFIG & UNIFIED ROUTE PIPELINE
    // =========================================================================
    const API_ACTION = '/api/action';

    const btnCW = document.getElementById('btnCW');
    const btnCCW = document.getElementById('btnCCW');
    const btnStop = document.getElementById('btnStop');
    const btnMagOn = document.getElementById('btnMagOn');
    const btnMagOff = document.getElementById('btnMagOff');

    // Action Dispatcher
    async function sendAction(id, action) {
      try {
        await fetch(API_ACTION, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, action })
        });
      } catch (err) {}
    }

    // Click Handlers
    btnCW.addEventListener('click', () => {
      setMotionUI('forward');
      sendAction('crane', 'forward');
    });

    btnCCW.addEventListener('click', () => {
      setMotionUI('reverse');
      sendAction('crane', 'reverse');
    });

    btnStop.addEventListener('click', () => {
      setMotionUI('stop');
      sendAction('crane', 'stop');
    });

    btnMagOn.addEventListener('click', () => {
      setMagnetUI('on');
      sendAction('magnet', 'on');
    });

    btnMagOff.addEventListener('click', () => {
      setMagnetUI('off');
      sendAction('magnet', 'off');
    });

    // Active Highlight States
    function setMotionUI(state) {
      btnCW.classList.toggle('active-state', state === 'forward');
      btnCCW.classList.toggle('active-state', state === 'reverse');
      btnStop.classList.toggle('active-state', state === 'stop');
    }

    function setMagnetUI(state) {
      btnMagOn.classList.toggle('active-state', state === 'on');
      btnMagOff.classList.toggle('active-state', state === 'off');
    }

    // Initial Snapshot & WebSocket Live Sync
    async function loadSnapshot() {
      try {
        const res = await fetch('/api/items');
        const items = await res.json();
        if (items.crane_motion) setMotionUI(items.crane_motion.value);
        if (items.magnet_state) setMagnetUI(items.magnet_state.value);
      } catch (e) {}
    }
    loadSnapshot();

    function connectWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${window.location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'subscribe', item_id: 'crane_motion' }));
        ws.send(JSON.stringify({ type: 'subscribe', item_id: 'magnet_state' }));
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'update') {
            if (msg.item_id === 'crane_motion') setMotionUI(msg.value);
            if (msg.item_id === 'magnet_state') setMagnetUI(msg.value);
          }
        } catch (e) {}
      };

      ws.onclose = () => setTimeout(connectWs, 2000);
      ws.onerror = () => ws.close();
    }
    connectWs();
  </script>
</body>
</html>
