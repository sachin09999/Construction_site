<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crane Transparent Controls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* =========================================================================
       PURE TRANSPARENT CIRCULAR GUIDE (ZERO TRANSLUCENT FOG)
       ========================================================================= */
    /* =========================================================================
       INDUSTRIAL PRECISION HUD DIAL (CONSTRUCTION-MATCHED PALETTE)
       ========================================================================= */
    .circular-controller {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: transparent !important;
      border: 1.5px dashed rgba(251, 191, 36, 0.45); /* Construction Amber ring */
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 16px rgba(0, 0, 0, 0.85));
    }

    /* Subtle Rotating Outer Dash Accent */
    .orbit-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dotted rgba(251, 191, 36, 0.28);
      pointer-events: none;
      animation: slowSpin 40s linear infinite;
    }
    @keyframes slowSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* =========================================================================
       100% PURE CRYSTAL TRANSPARENT BUTTONS (ZERO BLACK FILL)
       ========================================================================= */
    .radial-btn {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      background: transparent !important; /* Pure transparent - no black */
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .radial-btn:hover {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.14) !important;
    }

    .radial-btn:active {
      transform: scale(0.92);
    }

    .radial-btn svg {
      transition: all 0.16s ease;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95));
    }

    /* -------------------------------------------------------------------------
       1. CENTER: STOP ROTATION (INDUSTRIAL SAFETY CRIMSON RED)
       ------------------------------------------------------------------------- */
    .btn-center-stop {
      width: 54px;
      height: 54px;
      background: transparent !important;
      border: 2.5px solid #ef4444;
      color: #ffffff;
      z-index: 10;
      box-shadow: 
        0 0 20px rgba(239, 68, 68, 0.7),
        inset 0 0 12px rgba(239, 68, 68, 0.35);
    }
    .btn-center-stop svg {
      width: 22px;
      height: 22px;
      fill: #ffffff !important;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.95));
    }
    .btn-center-stop:hover {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #f87171;
      box-shadow: 
        0 0 28px rgba(239, 68, 68, 0.95),
        inset 0 0 16px rgba(239, 68, 68, 0.5);
    }
    .btn-center-stop.active-state {
      background: #ef4444 !important;
      border-color: #ffffff !important;
      box-shadow: 
        0 0 34px #ef4444,
        inset 0 0 20px #ffffff !important;
    }

    /* -------------------------------------------------------------------------
       2. LEFT (9 O'CLOCK): ROTATE ANTI-CLOCKWISE / CCW (CONSTRUCTION AMBER GOLD)
       ------------------------------------------------------------------------- */
    .btn-left-ccw {
      left: 8px;
      width: 45px;
      height: 45px;
      background: transparent !important;
      border: 2.5px solid #fbbf24;
      color: #fbbf24;
      box-shadow: 
        0 0 18px rgba(251, 191, 36, 0.6),
        inset 0 0 12px rgba(251, 191, 36, 0.25);
    }
    .btn-left-ccw svg {
      width: 24px;
      height: 24px;
    }
    .btn-left-ccw:hover {
      background: rgba(251, 191, 36, 0.2) !important;
      border-color: #fde047;
      box-shadow: 
        0 0 26px rgba(253, 224, 71, 0.85),
        inset 0 0 14px rgba(251, 191, 36, 0.4);
    }
    .btn-left-ccw.active-state {
      background: #fbbf24 !important;
      border-color: #ffffff !important;
      color: #0f172a !important;
      box-shadow: 
        0 0 32px #fbbf24,
        inset 0 0 18px #ffffff !important;
      animation: spinCCW 2.4s linear infinite;
    }
    .btn-left-ccw.active-state svg {
      stroke: #0f172a !important;
    }
    @keyframes spinCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* -------------------------------------------------------------------------
       3. RIGHT (3 O'CLOCK): ROTATE CLOCKWISE / CW (CONSTRUCTION AMBER GOLD)
       ------------------------------------------------------------------------- */
    .btn-right-cw {
      right: 8px;
      width: 45px;
      height: 45px;
      background: transparent !important;
      border: 2.5px solid #fbbf24;
      color: #fbbf24;
      box-shadow: 
        0 0 18px rgba(251, 191, 36, 0.6),
        inset 0 0 12px rgba(251, 191, 36, 0.25);
    }
    .btn-right-cw svg {
      width: 24px;
      height: 24px;
    }
    .btn-right-cw:hover {
      background: rgba(251, 191, 36, 0.2) !important;
      border-color: #fde047;
      box-shadow: 
        0 0 26px rgba(253, 224, 71, 0.85),
        inset 0 0 14px rgba(251, 191, 36, 0.4);
    }
    .btn-right-cw.active-state {
      background: #fbbf24 !important;
      border-color: #ffffff !important;
      color: #0f172a !important;
      box-shadow: 
        0 0 32px #fbbf24,
        inset 0 0 18px #ffffff !important;
      animation: spinCW 2.4s linear infinite;
    }
    .btn-right-cw.active-state svg {
      stroke: #0f172a !important;
    }
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* -------------------------------------------------------------------------
       4. TOP (12 O'CLOCK): MAGNET ON (VIVID ELECTRIC EMERALD)
       ------------------------------------------------------------------------- */
    .btn-top-mag-on {
      top: 8px;
      width: 45px;
      height: 45px;
      background: transparent !important;
      border: 2.5px solid #10b981;
      color: #10b981;
      box-shadow: 
        0 0 20px rgba(16, 185, 129, 0.6),
        inset 0 0 12px rgba(16, 185, 129, 0.25);
    }
    .btn-top-mag-on svg {
      width: 24px;
      height: 24px;
    }
    .btn-top-mag-on:hover {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: #34d399;
      box-shadow: 
        0 0 28px rgba(52, 211, 153, 0.85),
        inset 0 0 14px rgba(16, 185, 129, 0.4);
    }
    .btn-top-mag-on.active-state {
      background: #10b981 !important;
      border-color: #ffffff !important;
      color: #ffffff !important;
      box-shadow: 
        0 0 34px #10b981,
        inset 0 0 18px #ffffff !important;
    }

    /* -------------------------------------------------------------------------
       5. BOTTOM (6 O'CLOCK): MAGNET OFF (SAFETY FIRE CORAL)
       ------------------------------------------------------------------------- */
    .btn-bottom-mag-off {
      bottom: 8px;
      width: 45px;
      height: 45px;
      background: transparent !important;
      border: 2.5px solid #f97316;
      color: #f97316;
      box-shadow: 
        0 0 18px rgba(249, 115, 22, 0.6),
        inset 0 0 12px rgba(249, 115, 22, 0.25);
    }
    .btn-bottom-mag-off svg {
      width: 24px;
      height: 24px;
    }
    .btn-bottom-mag-off:hover {
      background: rgba(249, 115, 22, 0.2) !important;
      border-color: #fb923c;
      box-shadow: 
        0 0 26px rgba(251, 146, 60, 0.85),
        inset 0 0 14px rgba(249, 115, 22, 0.4);
    }
    .btn-bottom-mag-off.active-state {
      background: #f97316 !important;
      border-color: #ffffff !important;
      color: #ffffff !important;
      box-shadow: 
        0 0 30px #f97316,
        inset 0 0 18px #ffffff !important;
    }
  </style>
</head>
<body>

  <!-- Pure Transparent Circular Controller -->
  <div class="circular-controller" id="controller">
    <div class="orbit-ring"></div>

    <!-- 12 O'CLOCK: MAGNET ON (PROPER MATERIAL DESIGN HORSESHOE MAGNET) -->
    <button class="radial-btn btn-top-mag-on" id="btnMagOn" aria-label="Magnet On">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
        <path d="M5 2c-1.1 0-2 .9-2 2v8c0 4.97 4.03 9 9 9s9-4.03 9-9V4c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v8c0 1.1-.9 2-2 2s-2-.9-2-2V4c0-1.1-.9-2-2-2H5zm0 2h3v3H5V4zm11 0h3v3h-3V4z"/>
      </svg>
    </button>

    <!-- 9 O'CLOCK: ROTATE LEFT - ANTICLOCKWISE (CCW) -->
    <button class="radial-btn btn-left-ccw" id="btnCCW" aria-label="Anticlockwise">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9c-2.6 0-5 1-6.8 2.6"/>
        <polyline points="3 4 3 9 8 9"/>
      </svg>
    </button>

    <!-- CENTER: PUNCHABLE STOP (CRIMSON RED) -->
    <button class="radial-btn btn-center-stop" id="btnStop" aria-label="Stop">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff">
        <rect x="6" y="6" width="12" height="12" rx="2.5" />
      </svg>
    </button>

    <!-- 3 O'CLOCK: ROTATE RIGHT - CLOCKWISE (CW) -->
    <button class="radial-btn btn-right-cw" id="btnCW" aria-label="Clockwise">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.6 0 5 1 6.8 2.6"/>
        <polyline points="21 4 21 9 16 9"/>
      </svg>
    </button>

    <!-- 6 O'CLOCK: MAGNET OFF (PROPER HORSESHOE MAGNET WITH STRIKE) -->
    <button class="radial-btn btn-bottom-mag-off" id="btnMagOff" aria-label="Magnet Off">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path d="M5 2c-1.1 0-2 .9-2 2v8c0 4.97 4.03 9 9 9s9-4.03 9-9V4c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v8c0 1.1-.9 2-2 2s-2-.9-2-2V4c0-1.1-.9-2-2-2H5zm0 2h3v3H5V4zm11 0h3v3h-3V4z" fill="#ffffff" opacity="0.45"/>
        <line x1="2" y1="2" x2="22" y2="22" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>

  </div>

  <script>
    // =========================================================================
    // CONFIG & UNIFIED ROUTE PIPELINE
    // =========================================================================
    const API_ACTION = '/api/action';

    const btnCW = document.getElementById('btnCW');
    const btnCCW = document.getElementById('btnCCW');
    const btnStop = document.getElementById('btnStop');
    const btnMagOn = document.getElementById('btnMagOn');
    const btnMagOff = document.getElementById('btnMagOff');

    // Action Dispatcher
    async function sendAction(id, action) {
      try {
        await fetch(API_ACTION, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, action })
        });
      } catch (err) {}
    }

    // Click Handlers
    btnCW.addEventListener('click', () => {
      setMotionUI('forward');
      sendAction('crane', 'forward');
    });

    btnCCW.addEventListener('click', () => {
      setMotionUI('reverse');
      sendAction('crane', 'reverse');
    });

    btnStop.addEventListener('click', () => {
      setMotionUI('stop');
      sendAction('crane', 'stop');
    });

    btnMagOn.addEventListener('click', () => {
      setMagnetUI('on');
      sendAction('magnet', 'on');
    });

    btnMagOff.addEventListener('click', () => {
      setMagnetUI('off');
      sendAction('magnet', 'off');
    });

    // Active Highlight States
    function setMotionUI(state) {
      btnCW.classList.toggle('active-state', state === 'forward');
      btnCCW.classList.toggle('active-state', state === 'reverse');
      btnStop.classList.toggle('active-state', state === 'stop');
    }

    function setMagnetUI(state) {
      btnMagOn.classList.toggle('active-state', state === 'on');
      btnMagOff.classList.toggle('active-state', state === 'off');
    }

    // Initial Snapshot & WebSocket Live Sync
    async function loadSnapshot() {
      try {
        const res = await fetch('/api/items');
        const items = await res.json();
        if (items.crane_motion) setMotionUI(items.crane_motion.value);
        if (items.magnet_state) setMagnetUI(items.magnet_state.value);
      } catch (e) {}
    }
    loadSnapshot();

    function connectWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${window.location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'subscribe', item_id: 'crane_motion' }));
        ws.send(JSON.stringify({ type: 'subscribe', item_id: 'magnet_state' }));
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'update') {
            if (msg.item_id === 'crane_motion') setMotionUI(msg.value);
            if (msg.item_id === 'magnet_state') setMagnetUI(msg.value);
          }
        } catch (e) {}
      };

      ws.onclose = () => setTimeout(connectWs, 2000);
      ws.onerror = () => ws.close();
    }
    connectWs();
  </script>
</body>
</html>
